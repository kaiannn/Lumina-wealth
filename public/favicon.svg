<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lumina Wealth">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- dark squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b1220"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#1f2937" stroke-width="1"/>

  <!-- lab focus ring (理念验证：观察/对照) -->
  <circle cx="32" cy="30" r="18" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 5"/>
  <circle cx="32" cy="30" r="12" fill="url(#glow)"/>

  <!-- firefly body -->
  <ellipse cx="32" cy="30" rx="5.5" ry="7" fill="url(#body)"/>
  <!-- wings -->
  <path d="M26.5 27.5c-4-1.5-7-0.5-8.5 2.5 3.5 1 6.5 0.5 8.5-2.5z" fill="#fde68a" fill-opacity="0.85"/>
  <path d="M37.5 27.5c4-1.5 7-0.5 8.5 2.5-3.5 1-6.5 0.5-8.5-2.5z" fill="#fde68a" fill-opacity="0.85"/>
  <!-- light point -->
  <circle cx="32" cy="24" r="2" fill="#fff7ed"/>

  <!-- portfolio bars (可解释指标) -->
  <rect x="20" y="46" width="6" height="8" rx="1.5" fill="url(#bar)" opacity="0.9"/>
  <rect x="29" y="42" width="6" height="12" rx="1.5" fill="url(#bar)"/>
  <rect x="38" y="38" width="6" height="16" rx="1.5" fill="url(#bar)"/>
</svg>
